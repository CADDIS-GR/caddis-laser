<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Flow Sheet · 작업 진행 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ── Hybrid: Dark base + MiniMax tokens ── */
  :root{
    /* dark canvas */
    --bg:#0d1117;
    --panel:#161b22;
    --panel-2:#1c2330;
    --line:#21262d;
    --line-soft:#30363d;
    /* ink */
    --ink:#e6edf3;
    --ink-soft:#8b949e;
    --ink-faint:#484f58;
    /* MiniMax accent + brand */
    --accent:#3b82f6;
    --brand-coral:#ff5530;
    --brand-blue:#1456f0;
    --brand-blue-200:rgba(59,130,246,.18);
    --brand-blue-deep:#3b82f6;
    /* status — MiniMax 컬러, 다크 bg */
    --st-wait:#8b949e;   --st-wait-bg:rgba(139,148,158,.12);
    --st-prog:#3b82f6;   --st-prog-bg:rgba(59,130,246,.13);
    --st-done:#1ba673;   --st-done-bg:rgba(27,166,115,.13);
    --st-ship:#ff5530;   --st-ship-bg:rgba(255,85,48,.13);
    /* 작업지시서 완료 — 연보라 */
    --doc-ok:#c4b5fd;    --doc-ok-bg:rgba(139,92,246,.16);  --doc-ok-k:rgba(139,92,246,.25);
    /* 작업내용 첨부 링크 — 청록 */
    --att:#5eead4;       --att-bg:rgba(45,212,191,.13);
    /* radius — MiniMax scale */
    --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-hero:24px; --r-full:9999px;
    /* spacing */
    --sp-sm:12px; --sp-md:16px; --sp-lg:20px; --sp-xl:24px; --sp-xxl:32px;
    --shadow:0 4px 24px rgba(0,0,0,.35);
    --shadow-sm:0 1px 4px rgba(0,0,0,.25);
    --nav-bg:rgba(13,17,23,.85);
    --sans:'DM Sans',sans-serif;
    --mono:'DM Mono',monospace;
  }

  /* ── Light theme (MiniMax 라이트) ── */
  [data-theme="light"]{
    --bg:#f7f8fa;
    --panel:#ffffff;
    --panel-2:#f2f3f5;
    --line:#eaecf0;
    --line-soft:#e5e7eb;
    --ink:#0a0a0a;
    --ink-soft:#5f5f5f;
    --ink-faint:#a8aab2;
    --accent:#1456f0;
    --brand-blue-200:#dbeafe;
    --brand-blue-deep:#1d4ed8;
    --st-wait:#5f5f5f;   --st-wait-bg:#f2f3f5;
    --st-prog:#1456f0;   --st-prog-bg:#eff4ff;
    --st-done:#1ba673;   --st-done-bg:#e8ffea;
    --st-ship:#ff5530;   --st-ship-bg:#fff2ef;
    --doc-ok:#5b3fc4;    --doc-ok-bg:#efeafd;  --doc-ok-k:#e4dcfb;
    --att:#0f766e;       --att-bg:#e3f8f4;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
    --shadow-sm:0 1px 3px rgba(0,0,0,.06);
    --nav-bg:rgba(255,255,255,.9);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
  body{min-height:100vh}

  /* ── nav ── */
  .top-nav{background:var(--nav-bg);border-bottom:1px solid var(--line-soft);
    height:56px;display:flex;align-items:center;padding:0 var(--sp-xxl);gap:var(--sp-xl);
    position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
  .nav-logo{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;
    letter-spacing:-.3px;color:var(--ink);text-decoration:none}
  .nav-mark{width:30px;height:30px;background:var(--accent);border-radius:var(--r-md);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
  .nav-right{display:flex;align-items:center;gap:8px;margin-left:auto}

  /* ── buttons — pill (MiniMax signature) ── */
  .btn{font-family:var(--sans);font-size:13px;font-weight:600;
    padding:8px 18px;border-radius:var(--r-full);cursor:pointer;border:none;
    display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{filter:brightness(1.1)}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line-soft)}
  .btn-ghost:hover{border-color:var(--ink-soft);color:var(--ink)}
  .btn-sm{padding:7px 16px;font-size:13px}

  /* ── wrap ── */
  .wrap{max-width:1640px;margin:0 auto;padding:36px var(--sp-xxl) 80px}

  /* ── page title ── */
  .page-title{margin-bottom:var(--sp-xxl)}
  .page-title .eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px}
  .page-title h1{font-size:36px;font-weight:700;line-height:1.15;letter-spacing:-.8px;color:var(--ink)}
  .page-title h1 span{color:var(--accent)}

  /* ── banner ── */
  #connBanner{font-family:var(--mono);font-size:12px;padding:9px 14px;
    border-radius:var(--r-lg);margin-bottom:var(--sp-xl);
    border:1px solid var(--line-soft);background:var(--panel);color:var(--ink-soft)}

  /* ── summary cards ── */
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-md);margin-bottom:var(--sp-xxl)}
  .sum-card{background:var(--panel);border:1px solid var(--line-soft);
    border-radius:var(--r-xl);padding:var(--sp-xl);position:relative;overflow:hidden;
    box-shadow:var(--shadow-sm)}
  .sum-card::after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--c)}
  .sum-card .k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
  .sum-card .v{font-size:38px;font-weight:700;line-height:1;margin-top:10px;color:var(--c);letter-spacing:-1px}
  .sum-card .sub{font-size:12px;color:var(--ink-faint);margin-top:6px}

  /* ── toolbar ── */
  .toolbar{display:flex;align-items:center;justify-content:space-between;
    gap:var(--sp-md);flex-wrap:wrap;margin-bottom:var(--sp-md)}

  /* view tabs — pill (MiniMax) */
  .views{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line-soft);
    padding:3px;border-radius:var(--r-full)}
  .view-tab{font-size:13px;font-weight:500;color:var(--ink-soft);background:transparent;
    border:none;padding:6px 16px;border-radius:var(--r-full);cursor:pointer;transition:.15s}
  .view-tab.active{background:var(--accent);color:#fff}
  .view-tab:hover:not(.active){color:var(--ink);background:var(--panel-2)}

  /* filter chips — pill */
  .filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .chip{font-size:12px;font-weight:500;color:var(--ink-soft);background:var(--panel);
    border:1px solid var(--line-soft);padding:5px 13px;border-radius:var(--r-full);cursor:pointer;transition:.15s}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chip:hover:not(.on){border-color:var(--ink-soft);color:var(--ink)}
  .search{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-full);
    padding:7px 16px;color:var(--ink);font-family:var(--sans);font-size:13px;width:180px;height:36px}
  .search::placeholder{color:var(--ink-faint)}
  .search:focus{outline:none;border-color:var(--accent);border-width:1.5px}

  /* ── TABLE ── */
  .panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-xl);
    overflow:hidden;box-shadow:var(--shadow-sm)}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-xl)}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:980px}
  thead th{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-soft);text-align:left;padding:11px 14px;
    border-bottom:1px solid var(--line-soft);background:var(--panel-2)}
  tbody td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr{transition:background .1s;cursor:pointer}
  tbody tr:hover{background:var(--panel-2)}
  tbody tr:last-child td{border-bottom:none}
  .cust{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-.2px}
  .due{font-family:var(--mono);font-size:12px;color:var(--ink-soft);white-space:nowrap}
  .due .arr{color:var(--ink-faint);margin:0 4px}
  .due.urgent{color:var(--brand-coral)}
  .docs{display:flex;flex-wrap:wrap;gap:4px}
  .doc{font-family:var(--mono);font-size:11px;background:var(--brand-blue-200);
    color:var(--brand-blue-deep);padding:2px 8px;border-radius:var(--r-sm);
    text-decoration:none;display:inline-flex;align-items:center;gap:3px;font-weight:500}
  a.doc{cursor:pointer;transition:.13s}
  a.doc:hover{background:var(--accent);color:#fff}
  a.doc::after{content:"↗";font-size:8px;opacity:.7}
  /* 작업지시서 완료 체크 — ○ 버튼: 완료 토글 / 칩: 링크 열기(기존 동작) */
  .dw{display:inline-flex;align-items:center;gap:3px}
  .dk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-faint);background:transparent;
    cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;line-height:1;color:transparent;transition:.13s;flex-shrink:0}
  .dk:hover{border-color:var(--doc-ok);color:var(--doc-ok)}
  .dk::before{content:"✓"}
  .dw.ok .dk{background:var(--doc-ok-k);border-color:transparent;color:var(--doc-ok)}
  .dw.auto .dk{cursor:default}

  /* 상태 배지 — 탭하면 단계 선택 창 */
  .st-pick{cursor:pointer;padding:5px 10px;transition:.13s}
  .st-pick:hover{filter:brightness(1.08);box-shadow:0 0 0 1px currentColor inset}
  .st-pick .caret{font-size:9px;opacity:.7;margin-left:1px}
  .stage-pop{position:absolute;z-index:70;display:flex;gap:6px;padding:8px;
    background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-lg);
    box-shadow:var(--shadow);animation:pop .15s ease}
  .stage-pop .sp-opt{border:1px solid transparent;cursor:pointer;font-family:var(--sans);
    font-size:13px;padding:9px 14px}
  .stage-pop .sp-opt.cur{border-color:currentColor}

  /* ── 보기 모드(기본) / 관리자 모드 — 실수 터치로 인한 편집 방지 ── */
  #adminBtn.on{background:var(--st-ship-bg);color:var(--brand-coral);border-color:var(--brand-coral)}
  body:not(.admin) #addBtn{display:none}
  body:not(.admin) tbody tr,
  body:not(.admin) .card,
  body:not(.admin) .tl-row{cursor:default !important}
  body:not(.admin) .card:hover{border-color:var(--line);transform:none;box-shadow:none}
  /* 참고용(도면) — 체크 없음, 회색 칩 */
  .dw.ref .doc{background:var(--panel-2);color:var(--ink-soft);border:1px solid var(--line-soft)}
  .dw.ref a.doc:hover{background:var(--line-soft);color:var(--ink)}
  .dw.ok .doc{background:var(--doc-ok-bg);color:var(--doc-ok)}
  .dw.ok a.doc:hover{background:var(--doc-ok-k);color:var(--doc-ok)}
  .dw.ok .doc::before{content:"✓";font-weight:700;margin-right:1px}
  .doc-cnt{font-family:var(--mono);font-size:11px;color:var(--ink-faint);align-self:center;margin-left:2px}
  .doc-cnt.full{color:var(--doc-ok);font-weight:600}
  .work{color:var(--ink-soft);font-size:13px;max-width:260px;line-height:1.45}
  .num{font-family:var(--mono);font-size:12px;color:var(--ink-soft);text-align:right;white-space:nowrap}

  .cust-sub{display:none;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--ink-faint);
    margin-top:3px;letter-spacing:0;word-break:break-all}

  /* ── 작업내용 (확장) — 여러 줄 텍스트 + 첨부 링크 ── */
  th.wk,td.wk{width:40%;min-width:360px}
  .wk-text{white-space:pre-line;word-break:break-word;color:var(--ink-soft);font-size:13px;line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .wk-text.open{display:block;-webkit-line-clamp:unset}
  .wk-text a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;word-break:break-all}
  .wk-more{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--accent);background:none;
    border:none;cursor:pointer;padding:3px 0 0}
  .wk-more:hover{text-decoration:underline}
  .atts{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
  .wk-text + .wk-more + .atts{margin-top:5px}
  .att{font-family:var(--mono);font-size:11px;font-weight:500;background:var(--att-bg);color:var(--att);
    padding:2px 8px;border-radius:var(--r-sm);text-decoration:none;display:inline-flex;align-items:center;gap:5px;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:.13s}
  a.att:hover{background:var(--att);color:var(--panel)}
  .att .ty{font-size:9px;font-weight:700;letter-spacing:.04em;opacity:.75;flex-shrink:0}
  .att .nm{overflow:hidden;text-overflow:ellipsis}

  /* status badge — pill */
  .st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
    padding:3px 10px;border-radius:var(--r-full);white-space:nowrap}
  .st .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .st[data-s="wait"]{color:var(--st-wait);background:var(--st-wait-bg)} .st[data-s="wait"] .dot{background:var(--st-wait)}
  .st[data-s="prog"]{color:var(--st-prog);background:var(--st-prog-bg)} .st[data-s="prog"] .dot{background:var(--st-prog)}
  .st[data-s="done"]{color:var(--st-done);background:var(--st-done-bg)} .st[data-s="done"] .dot{background:var(--st-done)}
  .st[data-s="ship"]{color:var(--st-ship);background:var(--st-ship-bg)} .st[data-s="ship"] .dot{background:var(--st-ship)}

  /* ── BOARD ── */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-md);align-items:start}
  .col{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-xl);
    min-height:120px;box-shadow:var(--shadow-sm)}
  .col-head{display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;border-bottom:1px solid var(--line)}
  .col-head .lbl{font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px;color:var(--ink-soft)}
  .col-head .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-faint);
    background:var(--panel-2);padding:2px 8px;border-radius:var(--r-full);border:1px solid var(--line)}
  .col-body{padding:10px;display:flex;flex-direction:column;gap:8px}
  .card{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:13px;cursor:pointer;transition:.15s}
  .card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 16px rgba(59,130,246,.15)}
  .card .c-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .card .c-cust{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-.2px}
  .card .c-due{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
  .card .c-work{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.5}
  .card .c-docs{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}

  /* ── CALENDAR ── */
  .cal{padding:14px 14px 16px;margin-bottom:var(--sp-md)}
  .cal-head{display:flex;align-items:center;gap:6px;margin-bottom:12px}
  .cal-title{font-size:17px;font-weight:700;letter-spacing:-.3px;min-width:120px;text-align:center}
  .cal-nav{width:36px;height:36px;border-radius:var(--r-full);border:1px solid var(--line-soft);
    background:transparent;color:var(--ink-soft);font-size:18px;cursor:pointer;line-height:1}
  .cal-nav:hover{color:var(--ink);border-color:var(--ink-soft)}
  .cal-today{margin-left:auto}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .cal-wd{font-size:11px;font-weight:600;color:var(--ink-faint);text-align:center;padding:2px 0 4px}
  .cal-wd:first-child{color:var(--brand-coral)}
  .cal-cell{min-height:96px;border:1px solid var(--line);border-radius:var(--r-md);padding:5px;
    display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:.12s;min-width:0}
  .cal-cell:hover{border-color:var(--line-soft);background:var(--panel-2)}
  .cal-cell.out{opacity:.45}
  .cal-cell.today .cal-dn{background:var(--accent);color:#fff}
  .cal-cell.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .cal-dn{font-family:var(--mono);font-size:11px;color:var(--ink-soft);width:22px;height:22px;
    border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
  .cal-ev{font-size:11px;font-weight:600;padding:2px 6px;border-radius:var(--r-sm);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal-ev[data-s="wait"]{color:var(--st-wait);background:var(--st-wait-bg)}
  .cal-ev[data-s="prog"]{color:var(--st-prog);background:var(--st-prog-bg)}
  .cal-ev[data-s="done"]{color:var(--st-done);background:var(--st-done-bg)}
  .cal-ev[data-s="ship"]{color:var(--st-ship);background:var(--st-ship-bg)}
  .cal-more{font-size:11px;color:var(--ink-faint);padding-left:4px}
  .cal-dots{display:none;flex-wrap:wrap;gap:3px;padding:0 2px}
  .cal-dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
  .cal-dots i[data-s="wait"]{--c:var(--st-wait)} .cal-dots i[data-s="prog"]{--c:var(--st-prog)}
  .cal-dots i[data-s="done"]{--c:var(--st-done)} .cal-dots i[data-s="ship"]{--c:var(--st-ship)}
  .cal-day{margin-bottom:var(--sp-md)}
  .cal-day-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
    font-size:14px;font-weight:600;border-bottom:1px solid var(--line);background:var(--panel-2)}
  .cal-day-head .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-faint);font-weight:500}
  .cal-item{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .cal-item:last-child{border-bottom:none}
  body.admin .cal-item{cursor:pointer}
  body.admin .cal-item:hover{background:var(--panel-2)}
  .ci-top{display:flex;align-items:center;gap:10px;min-width:0}
  .ci-job{font-size:14px;font-weight:600;letter-spacing:-.2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .empty{padding:60px 20px;text-align:center;color:var(--ink-faint);font-size:13px;font-family:var(--mono)}

  /* ── MODAL ── */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);
    display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-hero);
    width:100%;max-width:760px;box-shadow:0 24px 64px rgba(0,0,0,.5);animation:pop .2s ease}
  @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;
    padding:var(--sp-xl) var(--sp-xxl);border-bottom:1px solid var(--line)}
  .modal-head h3{font-size:22px;font-weight:700;letter-spacing:-.5px}
  .modal-body{padding:var(--sp-xl) var(--sp-xxl);display:flex;flex-direction:column;gap:var(--sp-md)}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
  .field input,.field textarea,.field select{background:var(--panel-2);border:1px solid var(--line-soft);
    border-radius:var(--r-md);padding:9px 12px;color:var(--ink);font-family:var(--sans);font-size:14px}
  .field textarea{resize:vertical;min-height:60px}
  #f_work{min-height:180px;line-height:1.55}
  #f_atts{min-height:84px}
  .field .hint{font-size:10.5px;color:var(--ink-faint);font-family:var(--mono)}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);border-width:1.5px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-sm)}
  .modal-foot{display:flex;justify-content:space-between;gap:10px;
    padding:var(--sp-md) var(--sp-xxl) var(--sp-xl);border-top:1px solid var(--line)}
  .x{cursor:pointer;color:var(--ink-faint);font-size:20px;line-height:1;background:none;border:none;
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;
    border-radius:var(--r-full);transition:.15s}
  .x:hover{background:var(--panel-2);color:var(--ink)}
  .del{color:var(--brand-coral);background:none;border:1px solid transparent;cursor:pointer;
    font-size:13px;font-weight:600;font-family:var(--sans);padding:8px 14px;border-radius:var(--r-full)}
  .del:hover{border-color:var(--brand-coral);background:var(--st-ship-bg)}

  /* stage picker — pill */
  .stagebar{display:flex;gap:5px;margin-top:2px}
  .stage-pick{flex:1;font-size:11px;font-weight:600;padding:8px 4px;border-radius:var(--r-full);
    border:1px solid var(--line-soft);background:var(--panel-2);color:var(--ink-faint);
    cursor:pointer;transition:.15s;text-align:center}
  .stage-pick:hover:not(.sel){border-color:var(--ink-soft);color:var(--ink)}
  .stage-pick.sel[data-s="wait"]{background:var(--st-wait-bg);color:var(--st-wait);border-color:var(--st-wait)}
  .stage-pick.sel[data-s="prog"]{background:var(--st-prog-bg);color:var(--st-prog);border-color:var(--st-prog)}
  .stage-pick.sel[data-s="done"]{background:var(--st-done-bg);color:var(--st-done);border-color:var(--st-done)}
  .stage-pick.sel[data-s="ship"]{background:var(--st-ship-bg);color:var(--st-ship);border-color:var(--st-ship)}

  /* ── responsive ── */
  /* 패드 가로·노트북 (≤1199px) — 사용자재는 건명 아래로, 표는 화면 폭에 맞춤 */
  @media(max-width:1199px){
    table{min-width:0}
    th.c-mat,td.c-mat{display:none}
    .cust-sub{display:block}
    .cust{min-width:120px;word-break:keep-all}
    th.wk,td.wk{width:auto;min-width:240px}
    thead th,tbody td{padding:12px 10px}
    .doc{white-space:nowrap}
  }
  @media(max-width:900px){
    .summary{grid-template-columns:repeat(2,1fr)}
    .board{grid-template-columns:1fr 1fr}
    .work{max-width:160px}
    th.wk,td.wk{min-width:200px}
    /* 납기 2줄로 — 시작일 / 납기일 */
    .due .arr{display:none}
    .due .d1,.due .d2,.due .dd{display:block}
    .due .d1{color:var(--ink-faint)}
  }
  @media(max-width:620px){
    .wrap{padding:16px 12px 60px}
    .page-title h1{font-size:26px}
    /* 요약 카드 2x2 유지 */
    .summary{grid-template-columns:repeat(2,1fr);gap:10px}
    .sum-card .v{font-size:30px}
    /* 툴바 세로 정렬 */
    .toolbar{flex-direction:column;align-items:stretch;gap:10px}
    .filters{flex-wrap:wrap}
    .search{width:100%}
    /* 뷰탭 */
    .views{width:fit-content}
    /* 테이블 — 가로 스크롤 */
    .table-scroll{border-radius:var(--r-xl)}
    /* 표 → 카드 목록 (가로 스크롤 없음) */
    .table-scroll{overflow:visible}
    table,tbody{display:block;min-width:0;font-size:13px}
    thead{display:none}
    tbody tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;padding:14px;
      border-bottom:1px solid var(--line)}
    tbody tr:last-child{border-bottom:none}
    tbody td{display:block;padding:0;border:none;min-width:0}
    td.cust{order:1;min-width:0;font-size:15px}
    td.c-st{order:2;justify-self:end}
    td.due{order:3;grid-column:1/-1}
    td.wk{order:4;grid-column:1/-1;min-width:0;width:auto}
    td.c-docs{order:5;grid-column:1/-1}
    td.c-docs.none{display:none}
    td.num{order:6;grid-column:1/-1;text-align:left}
    td.num::before{content:"정산  ";font-family:var(--sans);font-size:11px;color:var(--ink-faint)}
    .due .arr{display:inline}
    .due .d1,.due .d2,.due .dd{display:inline}
    .due .d1{color:inherit}
    /* 보드 1칸씩 */
    .board{grid-template-columns:1fr}
    /* 타임라인 */
    .tl-row{grid-template-columns:80px 1fr;gap:8px}
    /* 모달 */
    .overlay{padding:16px 8px}
    .modal{border-radius:var(--r-xl)}
    .modal-head,.modal-body,.modal-foot{padding-left:16px;padding-right:16px}
    .row2{grid-template-columns:1fr}
    /* nav */
    .top-nav{padding:0 12px;gap:8px}
    .nav-logo span:last-child{display:none}
    .btn-lbl{display:none}
    /* 달력 — 폰에선 건명 대신 단계 색 점 */
    .cal{padding:10px 8px 12px}
    .cal-grid{gap:2px}
    .cal-cell{min-height:54px;padding:3px}
    .cal-ev,.cal-more{display:none}
    .cal-dots{display:flex}
    .cal-title{min-width:96px;font-size:15px}
  }
</style>
</head>
<body>
<nav class="top-nav">
  <a class="nav-logo" href="index.html">
    <div class="nav-mark">C</div>
    <span>CADDIS 레이저</span>
  </a>

    <button class="btn btn-ghost btn-sm" id="themeBtn" title="테마 전환">◐</button>

<div class="wrap">
  <div class="page-title">
    <div class="eyebrow">Work Flow Sheet</div>
    <h1>작업 진행 <span>현황판</span></h1>
  </div>

  <section class="summary" id="summary"></section>

  <div class="toolbar">
    <div class="views" id="views">
      <button class="view-tab active" data-v="table">표</button>

<!-- modal -->

        <div class="field"><label>납기일</label><input id="f_due" type="date"></div>

      <div class="field">
        <label>작업내용</label>
        <textarea id="f_work" placeholder="예: 레이저 절단 + 벤딩&#10;- 절단 순서: 외곽 → 홀&#10;- 주의: 버 제거 후 출하&#10;(여러 줄 입력 가능 · 주소를 적으면 자동으로 링크가 됩니다)"></textarea>

        <textarea id="f_atts" placeholder="절단 순서.md | https://drive.google.com/...&#10;검사 기준서.pdf | https://drive.google.com/...&#10;https://docs.google.com/document/..."></textarea>
        <span class="hint">구글 드라이브 등의 공유 링크를 붙여넣으세요. 링크만 적으면 이름이 자동으로 붙습니다.</span>

      <div class="field">
        <label>작업지시서 (한 줄에 하나 · 파일명 | 링크)</label>
        <textarea id="f_docs" placeholder="jo-5030.pdf | https://drive.google.com/...&#10;jo-5050.pdf"></textarea>
        <span style="font-size:10.5px;color:var(--ink-faint);font-family:var(--mono)">링크는 선택입니다. 적으면 클릭해 열리고, 없으면 이름만 표시됩니다.</span>

        <div class="field"><label>자재비</label><input id="f_mat" type="number" placeholder="0"></div>
        <div class="field"><label>가공비</label><input id="f_fee" type="number" placeholder="0"></div>

          <div class="stage-pick" data-s="wait">대기</div>
          <div class="stage-pick" data-s="prog">진행</div>

<script>
/* ───────── 1단계 프로토타입: 데이터는 화면 안 샘플 (브라우저 메모리) ─────────
   2단계에서 이 SAMPLE 배열 대신 구글시트 Apps Script 연동으로 교체합니다. */
const STAGES = {
  wait:{label:'대기', color:'var(--st-wait)'},
  prog:{label:'진행', color:'var(--st-prog)'},
  done:{label:'완료', color:'var(--st-done)'},
  ship:{label:'납품', color:'var(--st-ship)'}
};
const STAGE_ORDER = ['wait','prog','done','ship'];

/* ───────── 구글시트 연결 설정 ─────────
   2단계에서 받은 Apps Script 웹앱 URL을 아래에 넣으면 시트 연동이 켜집니다.
   비워두면(''), 아래 샘플 데이터로 동작합니다(저장 안 됨). */
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbz-pyl_hSe9tnNO9ZBMIjhOlBmF6t6PK4It-uoAE-k1uRZwuFC5W_cvCBXiCZ6L_K5m/exec';
const USE_SHEETS = !!SHEETS_URL;

let DATA = [];
let nextId = 9;

let view = 'table';
let filter = 'all';
let query = '';
let editId = null;
let pickStage = 'wait';

const $ = s=>document.querySelector(s);
const area = $('#viewArea');

function fmt(n){ return '₩' + (Number(n)||0).toLocaleString('ko-KR'); }
function shortDate(d){ return d ? d.slice(2).replace(/-/g,'/') : '—'; }
function daysLeft(due){
  if(!due) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(due+'T00:00:00');
  return Math.round((d-today)/86400000);
}

function visible(){
  return DATA.filter(r=>{
    if(filter!=='all' && r.stage!==filter) return false;
    if(query){
      const q=query.toLowerCase();
      if(!(( r.job||'').toLowerCase().includes(q) || (r.work||'').toLowerCase().includes(q))) return false;
    }
    return true;
  }).sort((a,b)=>{
    // 최신 등록이 위로 — id(J+타임스탬프) 내림차순, tmp는 항상 최상단
    const av=String(a.id), bv=String(b.id);
    const at=av.startsWith('tmp'), bt=bv.startsWith('tmp');
    if(at&&!bt) return -1;
    if(bt&&!at) return 1;
    return bv.localeCompare(av);
  });
}

function renderSummary(){
  const counts = {wait:0,prog:0,done:0,ship:0};
  DATA.forEach(r=>counts[r.stage]++);
  const cards = [
    {k:'대기', v:counts.wait, c:'var(--st-wait)', sub:'착수 전'},
    {k:'진행', v:counts.prog, c:'var(--st-prog)', sub:'작업 중'},
    {k:'완료', v:counts.done, c:'var(--st-done)', sub:'가공 완료'},
    {k:'납품', v:counts.ship, c:'var(--st-ship)', sub:'출하 완료'}
  ];
  $('#summary').innerHTML = cards.map(c=>`
    <div class="sum-card" style="--c:${c.c}">
      <div class="k">${c.k}</div>
      <div class="v">${c.v}</div>
      <div class="sub">${c.sub}</div>
    </div>`).join('');
}

/* ── 작업내용 첨부 ──
   시트의 기존 '작업내용' 칸 하나에 함께 저장 (Apps Script 수정 불필요)
   형식:  본문 텍스트 … ⏎⏎── 첨부 ──⏎이름 | 링크⏎이름 | 링크 */
const ATT_MARK = '── 첨부 ──';
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function splitWork(w){
  w = String(w||'');
  let text = w, att = '';
  if(w.startsWith(ATT_MARK)){ text=''; att=w.slice(ATT_MARK.length); }
  else { const i = w.lastIndexOf('\n'+ATT_MARK); if(i>=0){ text=w.slice(0,i); att=w.slice(i+1+ATT_MARK.length); } }
  return {text:text.trim(), atts:parseAtts(att)};
}
function autoName(u){
  try{
    const h = new URL(u).hostname.replace(/^www\./,'');
    if(/docs\.google\.com/.test(h)){
      if(/\/spreadsheets\//.test(u)) return '구글 시트';
      if(/\/presentation\//.test(u)) return '구글 슬라이드';
      return '구글 문서';
    }
    if(/drive\.google\.com/.test(h)) return /\/folders\//.test(u) ? '드라이브 폴더' : '드라이브 파일';
    return h;
  }catch(e){ return '링크'; }
}
function parseAtts(s){
  return String(s||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const k = l.indexOf('|');
    let n = k>=0 ? l.slice(0,k).trim() : l, u = k>=0 ? l.slice(k+1).trim() : '';
    if(!u && /^https?:\/\//i.test(n)){ u=n; n=''; }
    if(u && !/^https?:\/\//i.test(u)) u='';
    return {name: n || (u?autoName(u):''), url:u};
  }).filter(a=>a.name);
}
function attLine(a){ return a.url ? `${a.name} | ${a.url}` : a.name; }
function joinWork(text, attsRaw){
  const list = parseAtts(attsRaw);
  if(!list.length) return text;
  return (text ? text+'\n\n' : '') + ATT_MARK + '\n' + list.map(attLine).join('\n');
}
function attType(a){
  const n = a.name.toLowerCase(), u = (a.url||'').toLowerCase();
  const m = n.match(/\.([a-z0-9]{2,5})$/);
  if(m){
    const e = m[1];
    if(e==='pdf') return 'PDF';
    if(e==='md'||e==='txt') return 'MD';
    if(['xls','xlsx','csv'].includes(e)) return 'XLS';
    if(['doc','docx','hwp','hwpx'].includes(e)) return 'DOC';
    if(['dwg','dxf','step','stp'].includes(e)) return 'CAD';
    if(['png','jpg','jpeg','gif','webp'].includes(e)) return 'IMG';
    return e.toUpperCase();
  }
  if(u.includes('/spreadsheets/')) return 'SHEET';
  if(u.includes('/presentation/')) return 'SLIDE';
  if(u.includes('docs.google.com')) return 'DOC';
  if(u.includes('drive.google.com')) return 'DRIVE';
  return 'LINK';
}
function linkify(t){
  return esc(t).replace(/https?:\/\/[^\s<]+[^\s<.,;:)\]'"]/g,
    u=>`<a href="${u}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${u}</a>`);
}
function workCell(r){
  const {text, atts} = splitWork(r.work);
  if(!text && !atts.length) return '<span style="color:var(--ink-faint)">—</span>';
  return (text ? `<div class="wk-text">${linkify(text)}</div><button class="wk-more" hidden>더보기 ▾</button>` : '')
    + (atts.length ? `<div class="atts">${atts.map(a=>{
        const inner = `<span class="ty">${attType(a)}</span><span class="nm">${esc(a.name)}</span>`;
        return a.url
          ? `<a class="att" href="${esc(a.url)}" target="_blank" rel="noopener" title="${esc(a.name)}" onclick="event.stopPropagation()">${inner}</a>`
          : `<span class="att" title="${esc(a.name)}">${inner}</span>`;
      }).join('')}</div>` : '');
}
/* 4줄 넘는 내용만 '더보기' 표시 — 보기 모드에서도 펼쳐 읽기 가능 */
function wireWork(){
  area.querySelectorAll('.wk-text').forEach(el=>{
    const btn = el.nextElementSibling;
    if(!btn || !btn.classList.contains('wk-more')) return;
    btn.hidden = !(el.scrollHeight > el.clientHeight + 2);
    btn.onclick = e=>{
      e.stopPropagation();
      const open = el.classList.toggle('open');
      btn.textContent = open ? '접기 ▴' : '더보기 ▾';
    };
  });
}

function stBadge(s){
  return `<span class="st" data-s="${s}"><span class="dot"></span>${STAGES[s].label}</span>`;
}
/* ── 작업지시서 완료 표시 ──
   시트에는 이름 앞 '✓ ' 로 저장 → Apps Script 수정 없이 그대로 유지됨 */
const DONE_MARK = '✓';
function parseDoc(d){
  if(typeof d==='string'){ const [n,u]=d.split('|').map(p=>p.trim()); d={name:n||d.trim(), url:u||''}; }
  let name = String(d.name||'').trim(), done = !!d.done;
  if(name.startsWith(DONE_MARK)){ done = true; name = name.slice(DONE_MARK.length).trim(); }
  return {name, url:d.url||'', done};
}
function normDocs(docs){
  if(typeof docs==='string') docs = docs.split('\n').map(s=>s.trim()).filter(Boolean);
  return (Array.isArray(docs)?docs:[]).map(parseDoc).filter(d=>d.name);
}
function docsOut(docs){
  return (docs||[]).map(d=>{
    const done = !!d.done && !isRefDoc(d);   // 참고용(도면)은 완료 표시 저장 안 함
    return {name:(done?DONE_MARK+' ':'')+d.name, url:d.url||'', done};
  });
}
function docLine(d){
  const n = (d.done?DONE_MARK+' ':'')+d.name;
  return d.url ? `${n} | ${d.url}` : n;
}
function sheetObj(r){
  return {id:r.id, job:r.job, start:r.start, due:r.due, work:r.work, material:r.material,
    docs:docsOut(r.docs), mat:r.mat, fee:r.fee, stage:r.stage};
}
/* 완료·납품 단계는 지시서 전부 완료로 표시 (시트 값은 그대로) */
function stageDone(r){ return r.stage==='done' || r.stage==='ship'; }
function docDone(r, d){ return stageDone(r) || !!d.done; }
/* 참고용 지시서(체크 대상 아님) — 이름이 정확히 일치할 때만 */
const REF_DOCS = ['도면'];
function isRefDoc(d){ return REF_DOCS.includes(d.name); }
function docProgress(r){
  const list = (r.docs||[]).filter(d=>!isRefDoc(d));
  return {done:list.filter(d=>docDone(r,d)).length, total:list.length};
}
function docChips(r){
  const list = r.docs||[];
  if(!list.length) return '';
  const auto = stageDone(r);
  const {done, total} = docProgress(r);
  return list.map((d,i)=>isRefDoc(d)
      ? `<span class="dw ref">`
        + (d.url
            ? `<a class="doc" href="${d.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${d.name}</a>`
            : `<span class="doc">${d.name}</span>`)
        + `</span>`
      : `<span class="dw${docDone(r,d)?' ok':''}${auto?' auto':''}">`
      + (auto
          ? `<button class="dk" disabled title="${STAGES[r.stage].label} 단계 — 자동 완료"></button>`
          : `<button class="dk" data-rid="${r.id}" data-i="${i}" title="${d.done?'완료 취소':'완료 표시'}"></button>`)
      + (d.url
          ? `<a class="doc" href="${d.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${d.name}</a>`
          : `<span class="doc">${d.name}</span>`)
      + `</span>`).join('')
    + (total ? `<span class="doc-cnt${done===total?' full':''}">${done}/${total}</span>` : '');
}
function toggleDoc(rid, i){
  const r = DATA.find(x=>String(x.id)===String(rid)); if(!r||!r.docs||!r.docs[i]) return;
  if(String(r.id).startsWith('tmp')) return;   // 시트 id 발급 전엔 저장 불가
  r.docs[i].done = !r.docs[i].done;
  if(USE_SHEETS) sheetPost('update', sheetObj(r));
  render();
}
function wireDocChips(){
  wireWork();
  area.querySelectorAll('.dk').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    if(el.disabled) return;
    toggleDoc(el.dataset.rid, +el.dataset.i);
  });
  area.querySelectorAll('.st-pick').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    openStagePop(el);
  });
}

/* ── 상태 변경 — 보기 모드에서도 가능. 배지 탭 → 선택 창 → 단계 선택 ── */
function stPick(r){
  return `<span class="st st-pick" data-s="${r.stage}" data-rid="${r.id}" title="상태 변경"><span class="dot"></span>${STAGES[r.stage].label}<span class="caret">▾</span></span>`;
}
function closeStagePop(){ const p=document.getElementById('stagePop'); if(p) p.remove(); }
function openStagePop(badge){
  const rid = badge.dataset.rid;
  const r = DATA.find(x=>String(x.id)===String(rid)); if(!r) return;
  const already = document.getElementById('stagePop');
  closeStagePop();
  if(already && already.dataset.rid===String(rid)) return;   // 같은 배지 다시 누르면 닫기
  const pop = document.createElement('div');
  pop.id='stagePop'; pop.className='stage-pop'; pop.dataset.rid=String(rid);
  pop.innerHTML = STAGE_ORDER.map(s=>
    `<button class="st sp-opt${s===r.stage?' cur':''}" data-s="${s}"><span class="dot"></span>${STAGES[s].label}</button>`).join('');
  document.body.appendChild(pop);
  const b = badge.getBoundingClientRect();
  const left = Math.min(b.left + scrollX, scrollX + document.documentElement.clientWidth - pop.offsetWidth - 8);
  pop.style.left = Math.max(8, left) + 'px';
  pop.style.top = (b.bottom + scrollY + 6) + 'px';
  pop.querySelectorAll('.sp-opt').forEach(o=>o.onclick=e=>{
    e.stopPropagation();
    closeStagePop();
    setStage(rid, o.dataset.s);
  });
}
function setStage(rid, s){
  const r = DATA.find(x=>String(x.id)===String(rid)); if(!r || r.stage===s) return;
  if(String(r.id).startsWith('tmp')) return;   // 시트 id 발급 전엔 저장 불가
  r.stage = s;
  if(USE_SHEETS) sheetPost('update', sheetObj(r));
  render();
}
document.addEventListener('click', e=>{ if(!e.target.closest('#stagePop')) closeStagePop(); });
window.addEventListener('resize', closeStagePop);

function renderTable(rows){
  if(!rows.length){ area.innerHTML='<div class="panel"><div class="empty">표시할 작업이 없습니다.</div></div>'; return; }
  area.innerHTML = `<div class="panel"><div class="table-scroll"><table>
    <thead><tr>
      <th>건명</th><th>납기</th><th>상태</th><th>작업지시서</th><th class="c-mat">사용자재</th><th class="wk">작업내용</th><th style="text-align:right">정산</th>
    </tr></thead>
    <tbody>${rows.map(r=>{
      const dl = daysLeft(r.due);
      const urgent = (r.stage==='wait'||r.stage==='prog') && dl!==null && dl<=2;
      const total = (Number(r.mat)||0)+(Number(r.fee)||0);
      return `<tr data-id="${r.id}">
        <td class="cust">${r.job||'—'}${r.material?`<div class="cust-sub">${esc(r.material)}</div>`:''}</td>
        <td class="due ${urgent?'urgent':''}"><span class="d1">${shortDate(r.start)}</span><span class="arr">→</span><span class="d2">${shortDate(r.due)}</span>${urgent?`<span class="dd"> · D${dl<=0?'':'-'+dl}</span>`:''}</td>
        <td class="c-st">${stPick(r)}</td>
        <td class="c-docs${(r.docs||[]).length?'':' none'}"><div class="docs">${docChips(r)}</div></td>
        <td class="work c-mat" style="font-size:12px;color:var(--ink-soft)">${r.material||'<span style="color:var(--ink-faint)">—</span>'}</td>
        <td class="wk">${workCell(r)}</td>
        <td class="num">${total?fmt(total):'<span style="color:var(--ink-faint)">₩0</span>'}</td>
      </tr>`;
    }).join('')}</tbody></table></div></div>`;
  area.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>openEdit(tr.dataset.id));
  wireDocChips();
}

function renderBoard(rows){
  area.innerHTML = `<div class="board">${STAGE_ORDER.map(s=>{
    const items = rows.filter(r=>r.stage===s);
    return `<div class="col">
      <div class="col-head">
        <span class="lbl"><span class="st" data-s="${s}" style="padding:2px 8px"><span class="dot"></span>${STAGES[s].label}</span></span>
        <span class="cnt">${items.length}</span>
      </div>
      <div class="col-body">${items.map(r=>`
        <div class="card" data-id="${r.id}">
          <div class="c-top"><span class="c-cust">${r.job||'—'}</span><span class="c-due">${shortDate(r.due)}</span></div>
          <div style="margin-top:6px">${stPick(r)}</div>
          ${r.material?`<div style="font-size:11px;color:var(--ink-faint);margin-top:4px;font-family:var(--mono)">${r.material}</div>`:''}
          ${r.work?`<div class="c-work">${workCell(r)}</div>`:''}
          <div class="c-docs">${docChips(r)}</div>
        </div>`).join('') || '<div class="empty" style="padding:24px 8px;font-size:11px">—</div>'}
      </div>
    </div>`;
  }).join('')}</div>`;
  area.querySelectorAll('.card[data-id]').forEach(c=>c.onclick=()=>openEdit(c.dataset.id));
  wireDocChips();
}

/* ── 달력 뷰 — 시작일 기준 월간 달력, 날짜를 누르면 그날 작업 목록 ── */
function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
const WEEK = ['일','월','화','수','목','금','토'];
let calMonth = (()=>{ const t=new Date(); return new Date(t.getFullYear(), t.getMonth(), 1); })();
let calSel = ymd(new Date());

function calItem(r){
  return `<div class="cal-item" data-id="${r.id}">
    <div class="ci-top">${stPick(r)}<span class="ci-job">${r.job||'—'}</span></div>
    ${(r.docs||[]).length?`<div class="docs">${docChips(r)}</div>`:''}
    ${r.work?`<div>${workCell(r)}</div>`:''}
  </div>`;
}
function renderCalendar(rows){
  const today = ymd(new Date());
  const byDay = {};
  rows.forEach(r=>{ if(r.start) (byDay[r.start] = byDay[r.start]||[]).push(r); });
  const undated = rows.filter(r=>!r.start);

  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y, m, 1);
  const gridStart = new Date(y, m, 1 - first.getDay());
  const lastDay = new Date(y, m+1, 0).getDate();
  const weeks = Math.ceil((first.getDay() + lastDay) / 7);
  let cells = '';
  for(let i=0;i<weeks*7;i++){
    const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate()+i);
    const key = ymd(d), list = byDay[key]||[];
    const cls = ['cal-cell'];
    if(d.getMonth()!==m) cls.push('out');
    if(key===today) cls.push('today');
    if(key===calSel) cls.push('sel');
    cells += `<div class="${cls.join(' ')}" data-day="${key}">
      <span class="cal-dn">${d.getDate()}</span>
      ${list.slice(0,3).map(r=>`<span class="cal-ev" data-s="${r.stage}">${r.job||'—'}</span>`).join('')}
      ${list.length>3?`<span class="cal-more">+${list.length-3}</span>`:''}
      ${list.length?`<span class="cal-dots">${list.map(r=>`<i data-s="${r.stage}"></i>`).join('')}</span>`:''}
    </div>`;
  }

  const selList = byDay[calSel]||[];
  const sd = new Date(calSel+'T00:00:00');
  const selTitle = `${sd.getMonth()+1}월 ${sd.getDate()}일 (${WEEK[sd.getDay()]})${calSel===today?' · 오늘':''}`;

  area.innerHTML = `<div class="panel cal">
      <div class="cal-head">
        <button class="cal-nav" data-nav="-1" aria-label="이전 달">‹</button>
        <span class="cal-title">${y}년 ${m+1}월</span>
        <button class="cal-nav" data-nav="1" aria-label="다음 달">›</button>
        <button class="btn btn-ghost btn-sm cal-today" data-nav="0">오늘</button>
      </div>
      <div class="cal-grid">${WEEK.map(w=>`<div class="cal-wd">${w}</div>`).join('')}${cells}</div>
    </div>
    <div class="panel cal-day">
      <div class="cal-day-head">${selTitle}<span class="cnt">${selList.length}건</span></div>
      ${selList.length ? selList.map(calItem).join('') : '<div class="empty" style="padding:28px 12px">이 날 시작한 작업이 없습니다.</div>'}
    </div>
    ${undated.length?`<div class="panel cal-day">
      <div class="cal-day-head">날짜 없음<span class="cnt">${undated.length}건</span></div>
      ${undated.map(calItem).join('')}
    </div>`:''}`;

  area.querySelectorAll('.cal-nav,.cal-today').forEach(b=>b.onclick=()=>{
    const n = +b.dataset.nav;
    if(n===0){ const t=new Date(); calMonth=new Date(t.getFullYear(), t.getMonth(), 1); calSel=ymd(t); }
    else calMonth = new Date(y, m+n, 1);
    render();
  });
  area.querySelectorAll('.cal-cell').forEach(c=>c.onclick=()=>{
    calSel = c.dataset.day;
    const d = new Date(calSel+'T00:00:00');
    if(d.getMonth()!==m) calMonth = new Date(d.getFullYear(), d.getMonth(), 1);
    render();
  });
  area.querySelectorAll('.cal-item[data-id]').forEach(it=>it.onclick=()=>openEdit(it.dataset.id));
  wireDocChips();
}

function render(){
  renderSummary();
  const rows = visible();
  if(view==='table') renderTable(rows);
  else if(view==='board') renderBoard(rows);
  else renderCalendar(rows);
}

/* ── modal logic ── */
function setStagePicker(s){
  pickStage = s;
  document.querySelectorAll('.stage-pick').forEach(p=>p.classList.toggle('sel',p.dataset.s===s));
}
function openAdd(){
  if(!isAdmin()) return;
  editId=null;
  $('#modalTitle').textContent='작업 추가';
  $('#f_cust').value='';$('#f_start').value='';$('#f_due').value='';
  $('#f_work').value='';$('#f_atts').value='';$('#f_material').value='';$('#f_docs').value='';$('#f_mat').value='';$('#f_fee').value='';
  setStagePicker('wait');
  $('#delBtn').style.visibility='hidden';
  $('#overlay').classList.add('show');
}
function openEdit(id){
  if(!isAdmin()) return;   // 보기 모드에선 등록 내용 수정 불가 (○ 완료 체크는 가능)
  const r=DATA.find(x=>String(x.id)===String(id)); if(!r)return;
  editId=id;
  $('#modalTitle').textContent='작업 수정';
  $('#f_cust').value=r.job;$('#f_start').value=r.start;$('#f_due').value=r.due;
  const sw=splitWork(r.work);
  $('#f_work').value=sw.text;
  $('#f_atts').value=sw.atts.map(attLine).join('\n');
  $('#f_material').value=r.material||'';
  $('#f_docs').value=(r.docs||[]).map(docLine).join('\n');
  $('#f_mat').value=r.mat||'';$('#f_fee').value=r.fee||'';
  setStagePicker(r.stage);
  $('#delBtn').style.visibility='visible';
  $('#overlay').classList.add('show');
}
function closeModal(){ $('#overlay').classList.remove('show'); }
function save(){
  const obj={
    job:$('#f_cust').value.trim(),
    start:$('#f_start').value,
    due:$('#f_due').value,
    work:joinWork($('#f_work').value.trim(), $('#f_atts').value),
    material:$('#f_material').value.trim(),
    docs:normDocs($('#f_docs').value),
    mat:+$('#f_mat').value||0,
    fee:+$('#f_fee').value||0,
    stage:pickStage
  };
  if(!obj.job){ $('#f_cust').focus(); return; }

  if(USE_SHEETS){
    if(editId){
      obj.id = editId;
      sheetPost('update', sheetObj(obj));
      Object.assign(DATA.find(x=>String(x.id)===String(editId)), obj);
    } else {
      // 임시 id로 화면에 먼저 반영, 시트에서 실제 id 발급
      const temp = Object.assign({id:'tmp'+Date.now()}, obj);
      DATA.push(temp);
      const out = sheetObj(obj); delete out.id;
      sheetPost('add', out).then(res=>{ if(res&&res.id){ temp.id=res.id; render(); } });
    }
  } else {
    if(editId){ Object.assign(DATA.find(x=>String(x.id)===String(editId)),obj); }
    else { obj.id=nextId++; DATA.push(obj); }
  }
  closeModal(); render();
}
function del(){
  if(editId && confirm('이 작업을 삭제할까요?')){
    if(USE_SHEETS) sheetPost('delete', {id:editId});
    DATA=DATA.filter(x=>String(x.id)!==String(editId)); closeModal(); render();
  }
}

/* ── 구글시트 통신 ── */
function sheetGet(){
  return fetch(SHEETS_URL).then(r=>r.json()).then(res=>{
    if(res && res.ok && Array.isArray(res.rows)) return res.rows;
    return null;
  }).catch(()=>null);
}
function sheetPost(action, data){
  // text/plain 으로 보내 CORS 프리플라이트를 피함
  return fetch(SHEETS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action, data})
  }).then(r=>r.json()).catch(e=>{ console.warn('sheet post fail',e); return null; });
}
function setBanner(state){
  let el = document.getElementById('connBanner');
  if(!el){
    el = document.createElement('div');
    el.id='connBanner';
    el.style.cssText='font-family:var(--mono);font-size:11.5px;padding:8px 12px;border-radius:9px;margin-bottom:14px;border:1px solid var(--line-soft)';
    $('#summary').insertAdjacentElement('beforebegin', el);
  }
  if(state==='sample'){ el.style.color='var(--st-ship)'; el.innerHTML='● 샘플 데이터 — 시트 미연결 (변경은 저장되지 않습니다)'; }
  else if(state==='live'){ el.style.color='var(--st-done)'; el.innerHTML='● 시트 연결됨 — 변경이 저장됩니다'; }
  else if(state==='loading'){ el.style.color='var(--ink-soft)'; el.innerHTML='● 시트에서 불러오는 중…'; }
  else if(state==='error'){ el.style.color='#d36a6a'; el.innerHTML='● 시트 연결 실패 — 주소를 확인하세요 (지금은 샘플 표시)'; }
}

/* ── export (gentle path: snapshot to clipboard/JSON) ── */
function exportSnapshot(){
  const blob = new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='workflow-snapshot-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(url);
}

/* ── wiring ── */
$('#views').querySelectorAll('.view-tab').forEach(t=>t.onclick=()=>{
  view=t.dataset.v;
  $('#views').querySelectorAll('.view-tab').forEach(x=>x.classList.toggle('active',x===t));
  render();
});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  filter=c.dataset.f;
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));
  render();
});
$('#search').oninput=e=>{query=e.target.value;render();};
$('#addBtn').onclick=openAdd;
/* ── 보기 / 관리자 모드 — 직접 끌 때까지 유지 ── */
function isAdmin(){ return document.body.classList.contains('admin'); }
function setAdmin(on){
  document.body.classList.toggle('admin', on);
  $('#adminBtn').classList.toggle('on', on);
  $('#adminBtn').innerHTML = on ? '🔓<span class="btn-lbl"> 관리자 모드</span>' : '🔒<span class="btn-lbl"> 보기 모드</span>';
  if(!on) closeModal();
  try{ localStorage.setItem('wf-admin', on?'1':'0'); }catch(e){}
}
$('#adminBtn').onclick=()=>setAdmin(!isAdmin());
(()=>{ let on=false; try{ on = localStorage.getItem('wf-admin')==='1'; }catch(e){} setAdmin(on); })();
$('#closeX').onclick=closeModal;
$('#cancelBtn').onclick=closeModal;
$('#saveBtn').onclick=save;
$('#delBtn').onclick=del;
$('#exportBtn').onclick=exportSnapshot;
$('#overlay').onclick=e=>{ if(e.target===$('#overlay')) closeModal(); };
document.querySelectorAll('.stage-pick').forEach(p=>p.onclick=()=>setStagePicker(p.dataset.s));
$('#themeBtn').onclick=()=>{
  const b=document.documentElement;
  const isLight = b.dataset.theme==='light';
  b.dataset.theme = isLight ? 'dark' : 'light';
  $('#themeBtn').textContent = isLight ? '◐' : '◑';
  localStorage.setItem('wf-theme', b.dataset.theme);
};
// 저장된 테마 복원
(()=>{
  const saved = localStorage.getItem('wf-theme');
  if(saved){ document.documentElement.dataset.theme=saved; $('#themeBtn').textContent=saved==='light'?'◑':'◐'; }
})();
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal(); closeStagePop(); } });

/* ── 초기 로딩 ── */
async function init(){
  if(USE_SHEETS){
    setBanner('loading'); render();
    const rows = await sheetGet();
    if(rows){ DATA = rows.map(r=>Object.assign(r,{docs:normDocs(r.docs)})); setBanner('live'); }
    else { setBanner('error'); }   // 실패 시 샘플 유지
    render();
  } else {
    setBanner('sample'); render();
  }
}
init();
</script>
