<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CADDIS 레이저 — 외주관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ── Hybrid: Dark base + MiniMax tokens ── */
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --panel-2:#1c2330;
    --line:#21262d;
    --line-soft:#30363d;
    --ink:#e6edf3;
    --ink-soft:#8b949e;
    --ink-faint:#484f58;
    --accent:#3b82f6;
    --brand-coral:#ff5530;
    --brand-blue-200:rgba(59,130,246,.18);
    --brand-blue-deep:#3b82f6;
    --st-est:#8b949e;    --st-est-bg:rgba(139,148,158,.12);
    --st-ord:#3b82f6;    --st-ord-bg:rgba(59,130,246,.13);
    --st-prog:#f59e0b;   --st-prog-bg:rgba(245,158,11,.13);
    --st-done:#1ba673;   --st-done-bg:rgba(27,166,115,.13);
    --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-hero:24px; --r-full:9999px;
    --sp-sm:12px; --sp-md:16px; --sp-lg:20px; --sp-xl:24px; --sp-xxl:32px;
    --shadow:0 4px 24px rgba(0,0,0,.35);
    --shadow-sm:0 1px 4px rgba(0,0,0,.25);
    --nav-bg:rgba(13,17,23,.85);
    --sans:'DM Sans',sans-serif;
    --mono:'DM Mono',monospace;
  }
  [data-theme="light"]{
    --bg:#f7f8fa;
    --panel:#ffffff;
    --panel-2:#f2f3f5;
    --line:#eaecf0;
    --line-soft:#e5e7eb;
    --ink:#0a0a0a;
    --ink-soft:#5f5f5f;
    --ink-faint:#a8aab2;
    --accent:#1456f0;
    --brand-blue-200:#dbeafe;
    --brand-blue-deep:#1d4ed8;
    --st-est:#5f5f5f;    --st-est-bg:#f2f3f5;
    --st-ord:#1456f0;    --st-ord-bg:#eff4ff;
    --st-prog:#d97706;   --st-prog-bg:#fffbeb;
    --st-done:#1ba673;   --st-done-bg:#e8ffea;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
    --shadow-sm:0 1px 3px rgba(0,0,0,.06);
    --nav-bg:rgba(255,255,255,.9);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
  body{min-height:100vh}

  /* ── nav ── */
  .header{background:var(--nav-bg);border-bottom:1px solid var(--line-soft);
    height:56px;display:flex;align-items:center;padding:0 var(--sp-xxl);gap:var(--sp-xl);
    position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
  .logo{font-size:15px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:10px;color:var(--ink)}
  .logo-mark{width:30px;height:30px;background:var(--accent);border-radius:var(--r-md);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff}
  .nav{display:flex;gap:3px;margin-left:auto}
  .nav a{padding:6px 13px;border-radius:var(--r-full);border:none;background:transparent;
    color:var(--ink-soft);font-size:13px;font-weight:500;text-decoration:none;transition:.14s;cursor:pointer}
  .nav a:hover,.nav a.active{background:var(--panel-2);color:var(--ink)}
  .nav a.active{font-weight:600}
  .nav-actions{display:flex;align-items:center;gap:8px;margin-left:var(--sp-md)}

  /* ── buttons — pill ── */
  .btn{font-family:var(--sans);font-size:13px;font-weight:600;
    padding:8px 18px;border-radius:var(--r-full);cursor:pointer;border:none;
    display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.1)}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line-soft)}
  .btn.ghost:hover{border-color:var(--ink-soft);color:var(--ink)}

  /* ── wrap ── */
  .wrap{max-width:1200px;margin:0 auto;padding:36px var(--sp-xxl) 80px}

  /* ── banner ── */
  .banner{font-family:var(--mono);font-size:12px;padding:9px 14px;border-radius:var(--r-lg);
    margin-bottom:var(--sp-xl);border:1px solid var(--line-soft);
    background:var(--panel);color:var(--ink-soft);display:flex;align-items:center;gap:8px}
  .banner.sample{color:var(--st-prog)}
  .banner.live{color:var(--st-done)}
  .banner.loading{color:var(--ink-soft)}
  .banner.error{color:var(--brand-coral)}

  /* ── summary ── */
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-md);margin-bottom:var(--sp-xxl)}
  .sum-card{background:var(--panel);border:1px solid var(--line-soft);
    border-radius:var(--r-xl);padding:var(--sp-xl);position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
  .sum-card::after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--c)}
  .sum-card .k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
  .sum-card .v{font-size:38px;font-weight:700;line-height:1;margin-top:10px;color:var(--c);letter-spacing:-1px}
  .sum-card .sub{font-size:12px;color:var(--ink-faint);margin-top:6px}

  /* ── toolbar ── */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-md);flex-wrap:wrap;margin-bottom:var(--sp-md)}
  .filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{font-size:12px;font-weight:500;color:var(--ink-soft);background:var(--panel);
    border:1px solid var(--line-soft);padding:5px 13px;border-radius:var(--r-full);cursor:pointer;transition:.15s}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chip:hover:not(.on){border-color:var(--ink-soft);color:var(--ink)}
  .search{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-full);
    padding:7px 16px;color:var(--ink);font-family:var(--sans);font-size:13px;width:180px;height:36px}
  .search::placeholder{color:var(--ink-faint)}
  .search:focus{outline:none;border-color:var(--accent);border-width:1.5px}

  /* ── table ── */
  .panel-box{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow-sm)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-soft);text-align:left;padding:11px 14px;
    border-bottom:1px solid var(--line-soft);background:var(--panel-2)}
  tbody td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr{transition:background .1s;cursor:pointer}
  tbody tr:hover{background:var(--panel-2)}
  tbody tr:last-child td{border-bottom:none}
  .job-no{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:500}
  .job-name{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-.2px}
  .vendor{font-size:13px;color:var(--ink-soft)}
  .due-cell{font-family:var(--mono);font-size:12px;white-space:nowrap}
  .due-cell.urgent{color:var(--brand-coral)}
  .due-cell.ok{color:var(--ink-faint)}
  .amt{font-family:var(--mono);font-size:13px;text-align:right;white-space:nowrap;font-weight:500}
  .docs{display:flex;flex-wrap:wrap;gap:4px}
  .doc{font-family:var(--mono);font-size:11px;background:var(--brand-blue-200);
    color:var(--brand-blue-deep);padding:2px 8px;border-radius:var(--r-sm);
    text-decoration:none;display:inline-flex;align-items:center;gap:3px;font-weight:500}
  a.doc{cursor:pointer;transition:.13s}
  a.doc:hover{background:var(--accent);color:#fff}
  a.doc::after{content:"↗";font-size:8px;opacity:.7}
  .empty{padding:60px 20px;text-align:center;color:var(--ink-faint);font-size:13px;font-family:var(--mono)}

  /* ── status badge — pill ── */
  .st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
    padding:3px 10px;border-radius:var(--r-full);white-space:nowrap}
  .st .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .st[data-s="est"]{color:var(--st-est);background:var(--st-est-bg)} .st[data-s="est"] .dot{background:var(--st-est)}
  .st[data-s="ord"]{color:var(--st-ord);background:var(--st-ord-bg)} .st[data-s="ord"] .dot{background:var(--st-ord)}
  .st[data-s="prog"]{color:var(--st-prog);background:var(--st-prog-bg)} .st[data-s="prog"] .dot{background:var(--st-prog)}
  .st[data-s="done"]{color:var(--st-done);background:var(--st-done-bg)} .st[data-s="done"] .dot{background:var(--st-done)}

  /* ── modal ── */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);
    display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-hero);
    width:100%;max-width:520px;box-shadow:0 24px 64px rgba(0,0,0,.5);animation:pop .2s ease}
  @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;
    padding:var(--sp-xl) var(--sp-xxl);border-bottom:1px solid var(--line)}
  .modal-head h3{font-size:22px;font-weight:700;letter-spacing:-.5px}
  .modal-body{padding:var(--sp-xl) var(--sp-xxl);display:flex;flex-direction:column;gap:var(--sp-md)}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
  .field input,.field textarea,.field select{background:var(--panel-2);border:1px solid var(--line-soft);
    border-radius:var(--r-md);padding:9px 12px;color:var(--ink);font-family:var(--sans);font-size:14px}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);border-width:1.5px}
  .field textarea{resize:vertical;min-height:60px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-sm)}
  .modal-foot{display:flex;justify-content:space-between;gap:10px;
    padding:var(--sp-md) var(--sp-xxl) var(--sp-xl);border-top:1px solid var(--line)}
  .x{cursor:pointer;color:var(--ink-faint);font-size:20px;line-height:1;background:none;border:none;
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;
    border-radius:var(--r-full);transition:.15s}
  .x:hover{background:var(--panel-2);color:var(--ink)}
  .del-btn{color:var(--brand-coral);background:none;border:1px solid transparent;cursor:pointer;
    font-size:13px;font-weight:600;font-family:var(--sans);padding:8px 14px;border-radius:var(--r-full)}
  .del-btn:hover{border-color:var(--brand-coral);background:var(--st-done-bg)}

  /* stage picker — pill */
  .stagebar{display:flex;gap:5px;margin-top:2px}
  .stage-pick{flex:1;font-size:11px;font-weight:600;padding:8px 4px;border-radius:var(--r-full);
    border:1px solid var(--line-soft);background:var(--panel-2);color:var(--ink-faint);
    cursor:pointer;transition:.15s;text-align:center}
  .stage-pick:hover:not(.sel){border-color:var(--ink-soft);color:var(--ink)}
  .stage-pick.sel[data-s="est"]{background:var(--st-est-bg);color:var(--st-est);border-color:var(--st-est)}
  .stage-pick.sel[data-s="ord"]{background:var(--st-ord-bg);color:var(--st-ord);border-color:var(--st-ord)}
  .stage-pick.sel[data-s="prog"]{background:var(--st-prog-bg);color:var(--st-prog);border-color:var(--st-prog)}
  .stage-pick.sel[data-s="done"]{background:var(--st-done-bg);color:var(--st-done);border-color:var(--st-done)}

  @media(max-width:800px){
    .summary{grid-template-columns:repeat(2,1fr)}
    thead th:nth-child(5),tbody td:nth-child(5){display:none}
  }
  @media(max-width:560px){
    .wrap{padding:14px 10px 60px}
    thead th:nth-child(2),tbody td:nth-child(2){display:none}
    .search{width:120px}
  }
</style>
</head>

  </div>
  <nav class="nav">

<div class="wrap">

  <div class="toolbar">
    <div class="filters">

  <div class="panel-box">

<!-- 등록/수정 모달 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">

        <textarea id="f_invoice" placeholder="도면_파이프.dxf | https://drive.google.com/...&#10;명세표_20260611.pdf | https://drive.google.com/..."></textarea>
        <span style="font-size:10.5px;color:var(--ink-faint);font-family:var(--mono)">링크 없으면 이름만 표시됩니다.</span>

          <div class="stage-pick" data-s="ord">발주완료</div>
          <div class="stage-pick" data-s="prog">진행중</div>

<script>
/* ── 구글시트 설정 ──
   Apps Script 배포 URL을 아래에 넣으면 시트 연동이 켜집니다. */
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbymTedUYYrn5M-q5MHWPq-X2EGau4y2fEzy4Oh4tbuFxv1096GzHdQ0As3KW2YEST0B/exec';
const USE_SHEETS = !!SHEETS_URL;

const STAGES = {
  est:  { label:'견적중',   color:'var(--st-est)'  },
  ord:  { label:'발주완료', color:'var(--st-ord)'  },
  prog: { label:'진행중',   color:'var(--st-prog)' },
  done: { label:'납품완료', color:'var(--st-done)' }
};

let DATA = [];
let filter = 'all';
let query  = '';
let editId = null;
let pickStage = 'est';

const $ = s => document.querySelector(s);

/* ── 유틸 ── */
function fmt(n){ return '₩' + (Number(n)||0).toLocaleString('ko-KR'); }
function shortDate(d){ return d ? d.slice(2).replace(/-/g,'/') : '—'; }
function daysLeft(due){
  if(!due) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((new Date(due+'T00:00:00') - today) / 86400000);
}
function parseInvoice(cell){
  if(!cell) return [];
  return String(cell).split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{
    const [name, url] = line.split('|').map(p=>p.trim());
    return { name: name||line, url: url||'' };
  });
}
function serializeInvoice(arr){
  if(!arr||!arr.length) return '';
  return arr.map(x => x.url ? x.name+' | '+x.url : x.name).join('\n');
}
function invoiceChips(arr){
  return (arr||[]).map(d => d.url
    ? `<a class="doc" href="${d.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${d.name}</a>`
    : `<span class="doc">${d.name}</span>`
  ).join('');
}

/* ── 요약 카드 ── */
function renderSummary(){
  const cnt = { est:0, ord:0, prog:0, done:0 };
  DATA.forEach(r => cnt[r.stage]++);
  const cards = [
    { k:'견적중',   v:cnt.est,  c:'var(--st-est)' },
    { k:'발주완료', v:cnt.ord,  c:'var(--st-ord)' },
    { k:'진행중',   v:cnt.prog, c:'var(--st-prog)'},
    { k:'납품완료', v:cnt.done, c:'var(--st-done)'}
  ];
  $('#summary').innerHTML = cards.map(c=>`
    <div class="sum-card" style="--c:${c.c}">
      <div class="k">${c.k}</div>
      <div class="v">${c.v}</div>
      <div class="sub">${c.k} 건수</div>
    </div>`).join('');
}

/* ── 테이블 렌더 ── */
function visible(){
  return DATA.filter(r=>{
    if(filter!=='all' && r.stage!==filter) return false;
    if(query){
      const q=query.toLowerCase();
      if(!((r.no||'').toLowerCase().includes(q) ||
           (r.name||'').toLowerCase().includes(q) ||
           (r.vendor||'').toLowerCase().includes(q))) return false;
    }
    return true;
  });
}

function stBadge(s){
  return `<span class="st" data-s="${s}"><span class="dot"></span>${STAGES[s]?.label||s}</span>`;
}

function renderTable(){
  renderSummary();
  const rows = visible();
  if(!rows.length){
    $('#tbody').innerHTML = `<tr><td colspan="7"><div class="empty">표시할 건이 없습니다.</div></td></tr>`;
    return;
  }
  $('#tbody').innerHTML = rows.map(r=>{
    const dl = daysLeft(r.due);
    const urgent = (r.stage==='ord'||r.stage==='prog') && dl!==null && dl<=3;
    const dueClass = urgent ? 'urgent' : 'ok';
    const dueText = shortDate(r.due) + (urgent ? ` · D${dl<=0?'':'-'+dl}` : '');
    return `<tr data-id="${r.id}">
      <td class="job-no">${r.no||'—'}</td>
      <td class="job-name">${r.name||'—'}</td>
      <td class="vendor">${r.vendor||'—'}</td>
      <td>${stBadge(r.stage)}</td>
      <td class="due-cell ${dueClass}">${dueText}</td>
      <td class="amt">${r.amount ? fmt(r.amount) : '<span style="color:var(--ink-faint)">—</span>'}</td>
      <td><div class="docs">${invoiceChips(r.invoice)}</div></td>
    </tr>`;
  }).join('');
  $('#tbody').querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>openEdit(tr.dataset.id));
}

/* ── 모달 ── */
function setStagePicker(s){
  pickStage = s;
  document.querySelectorAll('.stage-pick').forEach(p=>p.classList.toggle('sel', p.dataset.s===s));
}
function openAdd(){
  editId = null;
  $('#modalTitle').textContent = '새 건 등록';
  $('#f_no').value=''; $('#f_name').value=''; $('#f_vendor').value='';
  $('#f_due').value=''; $('#f_amount').value=''; $('#f_invoice').value=''; $('#f_note').value='';
  setStagePicker('est');
  $('#delBtn').style.visibility='hidden';
  $('#overlay').classList.add('show');
}
function openEdit(id){
  const r = DATA.find(x=>String(x.id)===String(id)); if(!r) return;
  editId = id;
  $('#modalTitle').textContent = '건 수정';
  $('#f_no').value = r.no||'';
  $('#f_name').value = r.name||'';
  $('#f_vendor').value = r.vendor||'';
  $('#f_due').value = r.due||'';
  $('#f_amount').value = r.amount||'';
  $('#f_invoice').value = (r.invoice||[]).map(d=>d.url?`${d.name} | ${d.url}`:d.name).join('\n');
  $('#f_note').value = r.note||'';
  setStagePicker(r.stage||'est');
  $('#delBtn').style.visibility='visible';
  $('#overlay').classList.add('show');
}
function closeModal(){ $('#overlay').classList.remove('show'); }

function save(){
  const obj = {
    no:      $('#f_no').value.trim(),
    name:    $('#f_name').value.trim(),
    vendor:  $('#f_vendor').value.trim(),
    due:     $('#f_due').value,
    amount:  +$('#f_amount').value||0,
    invoice: $('#f_invoice').value.split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{
               const [name,url]=line.split('|').map(p=>p.trim());
               return {name:name||line,url:url||''};
             }),
    note:    $('#f_note').value.trim(),
    stage:   pickStage
  };
  if(!obj.no){ $('#f_no').focus(); return; }

  if(USE_SHEETS){
    if(editId){
      obj.id = editId;
      sheetPost('update', obj);
      Object.assign(DATA.find(x=>String(x.id)===String(editId)), obj);
    } else {
      const temp = Object.assign({ id:'tmp'+Date.now() }, obj);
      DATA.push(temp);
      sheetPost('add', obj).then(res=>{ if(res&&res.id) temp.id=res.id; });
    }
  } else {
    if(editId){ Object.assign(DATA.find(x=>String(x.id)===String(editId)), obj); }
    else { obj.id = 'J'+Date.now(); DATA.push(obj); }
  }
  closeModal(); renderTable();
}

function del(){
  if(editId && confirm('이 건을 삭제할까요?')){
    if(USE_SHEETS) sheetPost('delete', {id:editId});
    DATA = DATA.filter(x=>String(x.id)!==String(editId));
    closeModal(); renderTable();
  }
}

/* ── 시트 통신 ── */
function sheetGet(){
  return fetch(SHEETS_URL).then(r=>r.json()).then(res=>{
    if(res&&res.ok&&Array.isArray(res.rows)) return res.rows;
    return null;
  }).catch(()=>null);
}
function sheetPost(action, data){
  return fetch(SHEETS_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action, data})
  }).then(r=>r.json()).catch(e=>{console.warn('sheet error',e);return null;});
}

/* ── 배너 ── */
function setBanner(state){
  const el = $('#banner');
  el.className = 'banner ' + state;
  const msgs = {
    loading: '● 시트에서 불러오는 중…',
    live:    '● 시트 연결됨 — 변경이 저장됩니다',
    sample:  '● 샘플 없음 — 시트 미연결 (변경은 저장되지 않습니다)',
    error:   '● 시트 연결 실패 — URL을 확인하세요'
  };
  el.textContent = msgs[state]||'';
}

/* ── 내보내기 ── */
function exportSnapshot(){
  const blob = new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='outsource-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(url);
}

/* ── 이벤트 연결 ── */
$('#addBtn').onclick    = openAdd;
$('#closeX').onclick    = closeModal;
$('#cancelBtn').onclick = closeModal;
$('#saveBtn').onclick   = save;
$('#delBtn').onclick    = del;
$('#exportBtn').onclick = exportSnapshot;
$('#overlay').onclick   = e=>{ if(e.target===$('#overlay')) closeModal(); };
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  filter=c.dataset.f;
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));
  renderTable();
});
$('#search').oninput = e=>{ query=e.target.value; renderTable(); };
document.querySelectorAll('.stage-pick').forEach(p=>p.onclick=()=>setStagePicker(p.dataset.s));
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* ── 테마 토글 ── */
$('#themeBtn').onclick=()=>{
  const b=document.documentElement;
  const isLight = b.dataset.theme==='light';
  b.dataset.theme = isLight ? 'dark' : 'light';
  $('#themeBtn').textContent = isLight ? '◐' : '◑';
  localStorage.setItem('os-theme', b.dataset.theme);
};
(()=>{
  const saved = localStorage.getItem('os-theme');
  if(saved){ document.documentElement.dataset.theme=saved; $('#themeBtn').textContent=saved==='light'?'◑':'◐'; }
})();

/* ── 초기 로딩 ── */
async function init(){
  if(USE_SHEETS){
    setBanner('loading'); renderTable();
    const rows = await sheetGet();
    if(rows){ DATA=rows; setBanner('live'); }
    else { setBanner('error'); }
    renderTable();
  } else {
    setBanner('sample'); renderTable();
  }
}
init();
</script>
</body>
</html>
