<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CADDIS 레이저 — 외주관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel-2:#1c232d;
  --line:#2a323d; --line-soft:#222a34;
  --ink:#e7edf3; --ink-soft:#9aa7b4; --ink-faint:#5f6b78;
  --accent:#4ea1d3; --accent-soft:#2b5566;
  --st-est:#7c8794;   --st-est-bg:#262d36;
  --st-ord:#4ea1d3;   --st-ord-bg:#163243;
  --st-prog:#c9a14a;  --st-prog-bg:#2e2716;
  --st-done:#5cb98a;  --st-done-bg:#143028;
  --radius:14px; --shadow:0 10px 30px rgba(0,0,0,.35);
  --mono:'DM Mono',monospace;
  --serif:'DM Serif Display',serif;
  --sans:'Noto Sans KR',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}

/* ── header ── */
.header{background:var(--panel);border-bottom:1px solid var(--line);padding:0 24px;height:54px;
  display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.logo{font-size:15px;font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.logo-mark{width:28px;height:28px;background:var(--accent);border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{padding:6px 14px;border-radius:8px;border:none;background:transparent;color:var(--ink-soft);
  font-size:13px;text-decoration:none;transition:.14s;cursor:pointer}
.nav a:hover,.nav a.active{background:var(--panel-2);color:var(--ink)}
.nav a.active{font-weight:500}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--st-est);display:inline-block;margin-right:4px}
.conn-dot.live{background:var(--st-done)}

/* ── wrap ── */
.wrap{max-width:1200px;margin:0 auto;padding:28px 22px 80px}

/* ── banner ── */
.banner{font-family:var(--mono);font-size:11.5px;padding:9px 14px;border-radius:9px;
  margin-bottom:20px;border:1px solid var(--line-soft);display:flex;align-items:center;gap:8px}
.banner.sample{color:var(--st-prog)}
.banner.live{color:var(--st-done)}
.banner.loading{color:var(--ink-soft)}
.banner.error{color:#d36a6a}

/* ── summary ── */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.sum-card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:16px 18px;position:relative;overflow:hidden}
.sum-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.sum-card .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.sum-card .v{font-family:var(--serif);font-size:34px;line-height:1;margin-top:8px;color:var(--c)}
.sum-card .sub{font-size:11px;color:var(--ink-faint);margin-top:6px}

/* ── toolbar ── */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:12px;font-family:var(--mono);color:var(--ink-soft);background:var(--panel);
  border:1px solid var(--line-soft);padding:6px 11px;border-radius:20px;cursor:pointer;transition:.15s}
.chip.on{color:var(--ink);border-color:var(--accent)}
.search{background:var(--panel);border:1px solid var(--line-soft);border-radius:9px;
  padding:7px 11px;color:var(--ink);font-family:var(--sans);font-size:13px;width:180px}
.search::placeholder{color:var(--ink-faint)}
.search:focus{outline:none;border-color:var(--accent)}
.btn{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);padding:9px 14px;border-radius:10px;cursor:pointer;
  transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:#fff}

/* ── table ── */
.panel-box{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-soft);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);
  font-weight:500;background:var(--panel-2)}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr{transition:background .12s;cursor:pointer}
tbody tr:hover{background:var(--panel-2)}
tbody tr:last-child td{border-bottom:none}
.job-no{font-family:var(--mono);font-size:12px;color:var(--accent)}
.job-name{font-weight:500}
.vendor{font-size:12.5px;color:var(--ink-soft)}
.due-cell{font-family:var(--mono);font-size:12px;white-space:nowrap}
.due-cell.urgent{color:var(--st-prog)}
.due-cell.ok{color:var(--ink-faint)}
.amt{font-family:var(--mono);font-size:12.5px;text-align:right;white-space:nowrap}
.docs{display:flex;flex-wrap:wrap;gap:4px}
.doc{font-family:var(--mono);font-size:10.5px;background:var(--panel-2);border:1px solid var(--line-soft);
  color:var(--ink-soft);padding:2px 7px;border-radius:5px;text-decoration:none;display:inline-flex;align-items:center;gap:3px}
a.doc{cursor:pointer;transition:.14s}
a.doc:hover{border-color:var(--accent);color:var(--accent)}
a.doc::after{content:"↗";font-size:8px;opacity:.6}
.empty{padding:60px 20px;text-align:center;color:var(--ink-faint);font-family:var(--mono);font-size:13px}

/* ── status badge ── */
.st{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;
  font-weight:500;padding:4px 9px;border-radius:20px;white-space:nowrap}
.st .dot{width:6px;height:6px;border-radius:50%}
.st[data-s="est"]{color:var(--st-est);background:var(--st-est-bg)} .st[data-s="est"] .dot{background:var(--st-est)}
.st[data-s="ord"]{color:var(--st-ord);background:var(--st-ord-bg)} .st[data-s="ord"] .dot{background:var(--st-ord)}
.st[data-s="prog"]{color:var(--st-prog);background:var(--st-prog-bg)} .st[data-s="prog"] .dot{background:var(--st-prog)}
.st[data-s="done"]{color:var(--st-done);background:var(--st-done-bg)} .st[data-s="done"] .dot{background:var(--st-done)}

/* ── modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);
  display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.overlay.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;
  max-width:520px;box-shadow:var(--shadow);animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;justify-content:space-between;align-items:center;
  padding:18px 22px;border-bottom:1px solid var(--line-soft)}
.modal-head h3{font-family:var(--serif);font-size:21px;font-weight:400}
.modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}
.field input,.field textarea,.field select{background:var(--panel-2);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;color:var(--ink);font-family:var(--sans);font-size:14px}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent)}
.field textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-foot{display:flex;justify-content:space-between;gap:10px;padding:16px 22px;border-top:1px solid var(--line-soft)}
.x{cursor:pointer;color:var(--ink-faint);font-size:22px;line-height:1;background:none;border:none}
.x:hover{color:var(--ink)}
.del-btn{color:#d36a6a;background:none;border:1px solid transparent;cursor:pointer;
  font-size:13px;font-family:var(--sans);padding:6px 10px;border-radius:8px}
.del-btn:hover{border-color:#d36a6a}

.stagebar{display:flex;gap:6px;margin-top:2px}
.stage-pick{flex:1;font-family:var(--mono);font-size:11px;padding:8px 4px;border-radius:8px;
  border:1px solid var(--line);background:var(--panel-2);color:var(--ink-soft);cursor:pointer;transition:.14s;text-align:center}
.stage-pick.sel[data-s="est"]{background:var(--st-est-bg);color:var(--st-est);border-color:var(--st-est)}
.stage-pick.sel[data-s="ord"]{background:var(--st-ord-bg);color:var(--st-ord);border-color:var(--st-ord)}
.stage-pick.sel[data-s="prog"]{background:var(--st-prog-bg);color:var(--st-prog);border-color:var(--st-prog)}
.stage-pick.sel[data-s="done"]{background:var(--st-done-bg);color:var(--st-done);border-color:var(--st-done)}

@media(max-width:800px){
  .summary{grid-template-columns:repeat(2,1fr)}
  thead th:nth-child(5),tbody td:nth-child(5){display:none}
}
@media(max-width:560px){
  .wrap{padding:14px 10px 60px}
  thead th:nth-child(2),tbody td:nth-child(2){display:none}
  .search{width:120px}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-mark">C</div>
    CADDIS 레이저
  </div>
  <nav class="nav">
    <a href="outsource.html" class="active">외주관리</a>
    <a href="index.html">자재관리</a>
    <a href="#">견적</a>
    <a href="#">리포트</a>
  </nav>
  <button class="btn primary" id="addBtn" style="margin-left:8px">+ 새 건 등록</button>
</div>

<div class="wrap">
  <div class="banner loading" id="banner">● 불러오는 중…</div>
  <section class="summary" id="summary"></section>

  <div class="toolbar">
    <div class="filters">
      <span class="chip on" data-f="all">전체</span>
      <span class="chip" data-f="est">견적중</span>
      <span class="chip" data-f="ord">발주완료</span>
      <span class="chip" data-f="prog">진행중</span>
      <span class="chip" data-f="done">납품완료</span>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <input class="search" id="search" placeholder="건명·업체 검색">
      <button class="btn" id="exportBtn">↗ 내보내기</button>
    </div>
  </div>

  <div class="panel-box">
    <table id="tbl">
      <thead><tr>
        <th>건명번호</th>
        <th>건명</th>
        <th>외주업체</th>
        <th>상태</th>
        <th>납기일</th>
        <th style="text-align:right">발주금액</th>
        <th>첨부파일</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- 등록/수정 모달 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">새 건 등록</h3>
      <button class="x" id="closeX">×</button>
    </div>
    <div class="modal-body">
      <div class="row2">
        <div class="field">
          <label>건명번호</label>
          <input id="f_no" placeholder="예: JOB-2026-008">
        </div>
        <div class="field">
          <label>납기일</label>
          <input id="f_due" type="date">
        </div>
      </div>
      <div class="field">
        <label>건명</label>
        <input id="f_name" placeholder="예: ON FENDER 파이프 레이저">
      </div>
      <div class="field">
        <label>외주업체</label>
        <input id="f_vendor" placeholder="예: ○○레이저">
      </div>
      <div class="field">
        <label>발주금액</label>
        <input id="f_amount" type="number" placeholder="0">
      </div>
      <div class="field">
        <label>첨부파일 (파일명 | 드라이브링크)</label>
        <textarea id="f_invoice" placeholder="도면_파이프.dxf | https://drive.google.com/...&#10;명세표_20260611.pdf | https://drive.google.com/..."></textarea>
        <span style="font-size:10.5px;color:var(--ink-faint);font-family:var(--mono)">링크 없으면 이름만 표시됩니다.</span>
      </div>
      <div class="field">
        <label>진행 단계</label>
        <div class="stagebar" id="stagebar">
          <div class="stage-pick" data-s="est">견적중</div>
          <div class="stage-pick" data-s="ord">발주완료</div>
          <div class="stage-pick" data-s="prog">진행중</div>
          <div class="stage-pick" data-s="done">납품완료</div>
        </div>
      </div>
      <div class="field">
        <label>비고</label>
        <input id="f_note" placeholder="특이사항">
      </div>
    </div>
    <div class="modal-foot">
      <button class="del-btn" id="delBtn" style="visibility:hidden">삭제</button>
      <div style="display:flex;gap:8px">
        <button class="btn" id="cancelBtn">취소</button>
        <button class="btn primary" id="saveBtn">저장</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ── 구글시트 설정 ──
   Apps Script 배포 URL을 아래에 넣으면 시트 연동이 켜집니다. */
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbymTedUYYrn5M-q5MHWPq-X2EGau4y2fEzy4Oh4tbuFxv1096GzHdQ0As3KW2YEST0B/exec';
const USE_SHEETS = !!SHEETS_URL;

const STAGES = {
  est:  { label:'견적중',   color:'var(--st-est)'  },
  ord:  { label:'발주완료', color:'var(--st-ord)'  },
  prog: { label:'진행중',   color:'var(--st-prog)' },
  done: { label:'납품완료', color:'var(--st-done)' }
};

let DATA = [];
let filter = 'all';
let query  = '';
let editId = null;
let pickStage = 'est';

const $ = s => document.querySelector(s);

/* ── 유틸 ── */
function fmt(n){ return '₩' + (Number(n)||0).toLocaleString('ko-KR'); }
function shortDate(d){ return d ? d.slice(2).replace(/-/g,'/') : '—'; }
function daysLeft(due){
  if(!due) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((new Date(due+'T00:00:00') - today) / 86400000);
}
function parseInvoice(cell){
  if(!cell) return [];
  return String(cell).split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{
    const [name, url] = line.split('|').map(p=>p.trim());
    return { name: name||line, url: url||'' };
  });
}
function serializeInvoice(arr){
  if(!arr||!arr.length) return '';
  return arr.map(x => x.url ? x.name+' | '+x.url : x.name).join('\n');
}
function invoiceChips(arr){
  return (arr||[]).map(d => d.url
    ? `<a class="doc" href="${d.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${d.name}</a>`
    : `<span class="doc">${d.name}</span>`
  ).join('');
}

/* ── 요약 카드 ── */
function renderSummary(){
  const cnt = { est:0, ord:0, prog:0, done:0 };
  DATA.forEach(r => cnt[r.stage]++);
  const cards = [
    { k:'견적중',   v:cnt.est,  c:'var(--st-est)' },
    { k:'발주완료', v:cnt.ord,  c:'var(--st-ord)' },
    { k:'진행중',   v:cnt.prog, c:'var(--st-prog)'},
    { k:'납품완료', v:cnt.done, c:'var(--st-done)'}
  ];
  $('#summary').innerHTML = cards.map(c=>`
    <div class="sum-card" style="--c:${c.c}">
      <div class="k">${c.k}</div>
      <div class="v">${c.v}</div>
      <div class="sub">${c.k} 건수</div>
    </div>`).join('');
}

/* ── 테이블 렌더 ── */
function visible(){
  return DATA.filter(r=>{
    if(filter!=='all' && r.stage!==filter) return false;
    if(query){
      const q=query.toLowerCase();
      if(!((r.no||'').toLowerCase().includes(q) ||
           (r.name||'').toLowerCase().includes(q) ||
           (r.vendor||'').toLowerCase().includes(q))) return false;
    }
    return true;
  });
}

function stBadge(s){
  return `<span class="st" data-s="${s}"><span class="dot"></span>${STAGES[s]?.label||s}</span>`;
}

function renderTable(){
  renderSummary();
  const rows = visible();
  if(!rows.length){
    $('#tbody').innerHTML = `<tr><td colspan="7"><div class="empty">표시할 건이 없습니다.</div></td></tr>`;
    return;
  }
  $('#tbody').innerHTML = rows.map(r=>{
    const dl = daysLeft(r.due);
    const urgent = (r.stage==='ord'||r.stage==='prog') && dl!==null && dl<=3;
    const dueClass = urgent ? 'urgent' : 'ok';
    const dueText = shortDate(r.due) + (urgent ? ` · D${dl<=0?'':'-'+dl}` : '');
    return `<tr data-id="${r.id}">
      <td class="job-no">${r.no||'—'}</td>
      <td class="job-name">${r.name||'—'}</td>
      <td class="vendor">${r.vendor||'—'}</td>
      <td>${stBadge(r.stage)}</td>
      <td class="due-cell ${dueClass}">${dueText}</td>
      <td class="amt">${r.amount ? fmt(r.amount) : '<span style="color:var(--ink-faint)">—</span>'}</td>
      <td><div class="docs">${invoiceChips(r.invoice)}</div></td>
    </tr>`;
  }).join('');
  $('#tbody').querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>openEdit(tr.dataset.id));
}

/* ── 모달 ── */
function setStagePicker(s){
  pickStage = s;
  document.querySelectorAll('.stage-pick').forEach(p=>p.classList.toggle('sel', p.dataset.s===s));
}
function openAdd(){
  editId = null;
  $('#modalTitle').textContent = '새 건 등록';
  $('#f_no').value=''; $('#f_name').value=''; $('#f_vendor').value='';
  $('#f_due').value=''; $('#f_amount').value=''; $('#f_invoice').value=''; $('#f_note').value='';
  setStagePicker('est');
  $('#delBtn').style.visibility='hidden';
  $('#overlay').classList.add('show');
}
function openEdit(id){
  const r = DATA.find(x=>String(x.id)===String(id)); if(!r) return;
  editId = id;
  $('#modalTitle').textContent = '건 수정';
  $('#f_no').value = r.no||'';
  $('#f_name').value = r.name||'';
  $('#f_vendor').value = r.vendor||'';
  $('#f_due').value = r.due||'';
  $('#f_amount').value = r.amount||'';
  $('#f_invoice').value = (r.invoice||[]).map(d=>d.url?`${d.name} | ${d.url}`:d.name).join('\n');
  $('#f_note').value = r.note||'';
  setStagePicker(r.stage||'est');
  $('#delBtn').style.visibility='visible';
  $('#overlay').classList.add('show');
}
function closeModal(){ $('#overlay').classList.remove('show'); }

function save(){
  const obj = {
    no:      $('#f_no').value.trim(),
    name:    $('#f_name').value.trim(),
    vendor:  $('#f_vendor').value.trim(),
    due:     $('#f_due').value,
    amount:  +$('#f_amount').value||0,
    invoice: $('#f_invoice').value.split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{
               const [name,url]=line.split('|').map(p=>p.trim());
               return {name:name||line,url:url||''};
             }),
    note:    $('#f_note').value.trim(),
    stage:   pickStage
  };
  if(!obj.no){ $('#f_no').focus(); return; }

  if(USE_SHEETS){
    if(editId){
      obj.id = editId;
      sheetPost('update', obj);
      Object.assign(DATA.find(x=>String(x.id)===String(editId)), obj);
    } else {
      const temp = Object.assign({ id:'tmp'+Date.now() }, obj);
      DATA.push(temp);
      sheetPost('add', obj).then(res=>{ if(res&&res.id) temp.id=res.id; });
    }
  } else {
    if(editId){ Object.assign(DATA.find(x=>String(x.id)===String(editId)), obj); }
    else { obj.id = 'J'+Date.now(); DATA.push(obj); }
  }
  closeModal(); renderTable();
}

function del(){
  if(editId && confirm('이 건을 삭제할까요?')){
    if(USE_SHEETS) sheetPost('delete', {id:editId});
    DATA = DATA.filter(x=>String(x.id)!==String(editId));
    closeModal(); renderTable();
  }
}

/* ── 시트 통신 ── */
function sheetGet(){
  return fetch(SHEETS_URL).then(r=>r.json()).then(res=>{
    if(res&&res.ok&&Array.isArray(res.rows)) return res.rows;
    return null;
  }).catch(()=>null);
}
function sheetPost(action, data){
  return fetch(SHEETS_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action, data})
  }).then(r=>r.json()).catch(e=>{console.warn('sheet error',e);return null;});
}

/* ── 배너 ── */
function setBanner(state){
  const el = $('#banner');
  el.className = 'banner ' + state;
  const msgs = {
    loading: '● 시트에서 불러오는 중…',
    live:    '● 시트 연결됨 — 변경이 저장됩니다',
    sample:  '● 샘플 없음 — 시트 미연결 (변경은 저장되지 않습니다)',
    error:   '● 시트 연결 실패 — URL을 확인하세요'
  };
  el.textContent = msgs[state]||'';
}

/* ── 내보내기 ── */
function exportSnapshot(){
  const blob = new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='outsource-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(url);
}

/* ── 이벤트 연결 ── */
$('#addBtn').onclick    = openAdd;
$('#closeX').onclick    = closeModal;
$('#cancelBtn').onclick = closeModal;
$('#saveBtn').onclick   = save;
$('#delBtn').onclick    = del;
$('#exportBtn').onclick = exportSnapshot;
$('#overlay').onclick   = e=>{ if(e.target===$('#overlay')) closeModal(); };
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  filter=c.dataset.f;
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));
  renderTable();
});
$('#search').oninput = e=>{ query=e.target.value; renderTable(); };
document.querySelectorAll('.stage-pick').forEach(p=>p.onclick=()=>setStagePicker(p.dataset.s));
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* ── 초기 로딩 ── */
async function init(){
  if(USE_SHEETS){
    setBanner('loading'); renderTable();
    const rows = await sheetGet();
    if(rows){ DATA=rows; setBanner('live'); }
    else { setBanner('error'); }
    renderTable();
  } else {
    setBanner('sample'); renderTable();
  }
}
init();
</script>
</body>
